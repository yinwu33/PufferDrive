[base]
package = atlantic
env_name = adv_drive
policy_name = Drive
; Set to None to disable recurrence. In case this the policy will only see
; the current observation (o_t). Set to "Recurrent" to provide the policy with
; memory through an LSTM.
rnn_name = Recurrent

[vec]
num_workers = 8
num_envs = 8 
batch_size = 4
;backend = Serial

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1024
; Options: discrete, continuous
action_type = discrete
; Options: classic, jerk
dynamics_model = classic
; Fault-aware adversarial reward. f = non_self_fault_factor in [0, 1] blends the
; goal objective against the adversarial objective:
;   (1 - f) * goal + f * counterparty_self_fault
;        - self_fault_factor * self_fault - offroad_factor * offroad
; f = 0 -> pure goal-seeking, f = 1 -> pure adversarial (ignores its own goal and
; seeks collisions where the counterparty is at fault while ego is not).
; self-fault and offroad penalties stay active
; at all f. f applies to vehicles only; pedestrians/cyclists are forced to f = 0.
; Options: random, fixed
condition_sample_mode = "random"

self_fault_factor_min = 0.1
self_fault_factor_max = 1.0
fixed_self_fault_factor = 1.0

; f range. Keep within [0, 1] so the (1 - f) goal weight stays non-negative.
; f = 0 -> pure goal-seeking, f = 1 -> pure adversarial (ignores its own goal and
; f = 1 is not good, as it can lead to a degenerate policy that ignores its own goal and seeks collisions with other agents).
non_self_fault_factor_min = 0.
non_self_fault_factor_max = 1.0
fixed_non_self_fault_factor = 0.5

offroad_factor_min = 0.5
offroad_factor_max = 1.0
fixed_offroad_factor = 1.0
; Options: legacy, adversarial. Legacy penalizes every vehicle collision by self_fault_factor.
collision_reward_mode = "adversarial"
; Speeds at or below this value (m/s) are treated as nearly stationary.
fault_speed_threshold = 0.05
; How much of the bounding box counts as the leading face. The contact centroid is
; measured in the vehicle's own frame, normalized by its half length and half width
; so the box becomes a unit square and its corners sit at exactly 45 degrees. The
; default cos(45 deg) therefore selects the whole leading face corner to corner;
; larger values narrow it toward the centerline. The leading face is the front when
; driving forward and the rear when reversing.
front_contact_cos_threshold = 0.6
; Prevent repeated detach/re-collide reward farming. Already-stopped vehicles
; are never eligible for another positive collision reward.
non_self_fault_reward_once = True
; Only centerline (ROAD_LANE) road points enter the grid map / observation; offroad uses lane_center distance.
centerline_only = True
offroad_mode = "lane_center"
; for visualizan
lane_width = 5
 ; for training, obs params
fixed_lane_width = 5

dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25

reward_time_penalty = 0.001

; Meters around goal to be considered "reached"
goal_radius = 2.0
; Max target speed in m/s for the agent to maintain towards the goal
; max target speed when reach the goal
goal_speed = 10.0
; Penalty applied when reaching the goal faster than goal_speed
overspeed_penalty = 0.5
;[0: respawn, 1: generate_new_goals, 2: stop, 3: remove], what to do when the goal is reached
goal_behavior = 3
 ; distance to new goal when goal_behavior = generate_new_goals
goal_target_distance = 30.0
 ;[0: ignore, 1: stop, 2: remove], what to do when the agent collides with another agent
collision_behavior = 1
 ;[0: ignore, 1: stop, 2: remove], what to do when the agent goes offroad (vehicle only)
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
 # 0 - terminate at episode_length, 1 - terminate after all agents have been reset
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 10000
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; Options: "control_vehicles", "control_agents", "control_wosac", "control_sdc_only", "control_mixed_play"
control_mode = "control_agents"
; Options: "created_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
; Sets the maximum number of controllable agents per scene, ONLY used if control_mode is "control_mixed_play"
max_controlled_agents = 32
; Render mode options:
; 0:"window" = pop-up raylib window (original)
; 1:"headless" = off-screen; frames piped to ffmpeg (recommended for training)
render_mode = 1

[train]
seed=42
total_timesteps = 2_000_000_000
; learning_rate = 0.02
; gamma = 0.985
anneal_lr = True
anneal_entropy = False
; Needs to be: num_agents * num_workers * rollout_horizon
batch_size = 262144 # 524288 for 16
minibatch_size = 32768
max_minibatch_size = 32768
; bptt_horizon equals rollout_horizon at the moment.
; If you want to turn off recurrence, set rnn_name = None in [base]
rollout_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000

[eval]
; Eval frequency in epochs
eval_interval = 500
; Path to dataset used for evaluation
map_dir = "resources/drive/binaries/training"
; Number of agents to evaluate
num_eval_agents = 64
; If True, make eval reproducible by fixing RNG state and using deterministic actions
deterministic = False
; Seed used only when eval.deterministic = True
seed = 42
; Map sampling strategy for human/self-play eval: "random" or "sequential"
sample_mode = "random"
; Fixed reward factors used by evaluation.
; fixed_non_self_fault_factor is f in [0, 1]; 1.0 = fully adversarial eval.
condition_sample_mode = "random"
fixed_self_fault_factor = 0.1
fixed_non_self_fault_factor = 0.9
fixed_offroad_factor = 1.0
fixed_lane_width = 5.0
; If True, enable self-play evaluation (pair policy-controlled agent with a copy of itself)
self_play_eval = True
; If True, enable human replay evaluation (pair policy-controlled agent with human replays)
human_replay_eval = False
; Which env to render during eval. Options: "first" (by index), "worst_collision", "random"
render_select_mode = "first"
; If True, render random scenarios. Note: Doing this frequency will slow down the training.
render_human_replay_eval = True
render_self_play_eval = True
; Number of scenarios to process per batch
wosac_batch_size = 32
; Target number of unique scenarios perform evaluation in
wosac_target_scenarios = 64
; Total pool of scenarios to sample from
wosac_scenario_pool_size = 1000
; Max batches, used as a timeout to prevent an infinite loop
wosac_max_batches = 100
backend = PufferEnv
; WOSAC (Waymo Open Sim Agents Challenge) evaluation settings
; If True, enables evaluation on realism metrics each time we save a checkpoint
wosac_realism_eval = False
; Number of policy rollouts per scene
wosac_num_rollouts = 32
; When to start the simulation
wosac_init_steps = 10
; Control everything valid at init in the scene
wosac_control_mode = "control_wosac"
; Create everything in valid at init the scene
wosac_init_mode = "create_all_valid"
; Stop when reaching the goal
wosac_goal_behavior = 2
; Can shrink goal radius for WOSAC evaluation
wosac_goal_radius = 2.0
wosac_sanity_check = False
; Only return aggregate results across all scenes
wosac_aggregate_results = True
; Evaluation mode: "policy", "ground_truth"
wosac_eval_mode = "policy"

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
mean = 0.003
max = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.97
mean = 0.98
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.001, 0.005, 0.01]

[controlled_exp.train.seed]
values = [42, 55, 1]
