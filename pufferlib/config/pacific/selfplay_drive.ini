[base]
package = pacific
env_name = selfplay_drive
policy_name = Drive
rnn_name = None

[vec]
num_workers = 8
num_envs = 8
batch_size = 4
;backend = PufferEnv

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1024
action_type = discrete
dynamics_model = classic
collision_factor_min = 0.0
collision_factor_max = 2.0
offroad_factor_min = 0.0
offroad_factor_max = 2.0
condition_sample_mode = "random"
fixed_collision_factor = 2.0
fixed_offroad_factor = 2.0
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
reward_steer_jitter = 0.003   # penalize left-right steering oscillation (CLASSIC only); 0 disables
reward_time_penalty = 0.001   # small per-step penalty to encourage early goal arrival; 0 disables
goal_radius = 2.0  
goal_speed = 10.0  # max speed when reach the goal
goal_behavior = 3  # 0:"respawn", 1:"generate_new_goals", 2:"stop", 3: "remove"
goal_target_distance = 30.0
collision_behavior = 0
offroad_behavior = 0
offroad_mode = "lane_center"
lane_width = 4
; lane_width conditioning input (per-agent, sampled like collision/offroad factor); offroad uses this half-width
lane_width_min = 3.0
lane_width_max = 5.0
fixed_lane_width = 3.5
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "resources/drive/binaries/selfplay_train"
num_maps = 486995
init_steps = 0
control_mode = "control_agents"
init_mode = "create_all_valid"
max_controlled_agents = 32
render_mode = 1

[train]
seed = 42
total_timesteps = 3_000_000_000
anneal_lr = True
anneal_entropy = False
; num_agents * num_workers * rollout_horizon
batch_size = 262144
minibatch_size = 32768
max_minibatch_size = 32768
rollout_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.001
max_grad_norm = 1
prio_alpha = 0.85
prio_beta0 = 0.85
update_epochs = 1
vf_clip_coef = 0.2
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000

[eval]
eval_interval = 1000000
map_dir = "resources/drive/binaries/selfplay_train"
num_eval_agents = 16
deterministic = False
seed = 42
sample_mode = "sequential"
condition_sample_mode = "fixed"
fixed_collision_factor = 2.0
fixed_offroad_factor = 2.0
fixed_lane_width = 3.5
self_play_eval = True
human_replay_eval = False
render_select_mode = "first"
render_human_replay_eval = False
render_self_play_eval = False
wosac_batch_size = 8
wosac_target_scenarios = 10
wosac_scenario_pool_size = 10
wosac_max_batches = 10
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 1
wosac_init_steps = 0
wosac_control_mode = "control_agents"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
wosac_eval_mode = "policy"
